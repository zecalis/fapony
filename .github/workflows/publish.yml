name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # a hung test otherwise burns the 6h default
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --timeout 20000 --parallel

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; setup-node still ships older.
      - run: npm install -g npm@latest
      # No NODE_AUTH_TOKEN: npm trusts this repo + workflow filename, configured at
      # npmjs.com -> package -> Settings -> Trusted Publisher. Nothing to rotate every
      # 90 days, and provenance is attached automatically, so no --provenance flag.
      - run: npm publish --access public
